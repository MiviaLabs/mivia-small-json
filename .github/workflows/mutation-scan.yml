# Standing measurement of test strength over the decision modules
# (src/mivia_small_json/label.py, flywheel.py) — the modules where the
# improvement loop's high-severity findings lived. NOT a gate: a scoped
# run generates ~1700 mutants and takes far longer than a pull request
# may block on, so this runs weekly (and on demand) and only records
# the score. The blocking job lives in ci.yml (pytest + ruff).
#
# Actions are pinned to commit SHAs, same as ci.yml (supply-chain rule).
name: mutation-scan

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install from pinned requirements
        run: python -m pip install -r requirements-lock.txt

      - name: Install package (editable)
        run: python -m pip install -e .

      # mutmut must import the MUTATED source. An editable install's
      # import hook always wins over the mutants/ tree, so it is removed
      # first; mutmut's own sys.path setup then serves mutants/src.
      - name: Remove the editable install
        run: python -m pip uninstall -y mivia-small-json

      - name: Run the scoped mutation scan
        run: mutmut run

      - name: Record the score
        if: always()
        run: |
          {
            echo "## Mutation scan — label.py + flywheel.py"
            echo
            echo '```'
            python -m mutmut results || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
