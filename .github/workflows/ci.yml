# Minimal CI: enforces the AGENTS.md definition of done (pytest green, installable from pins).
# Actions are pinned to commit SHAs resolved from the remote (GitHub supply-chain recommendation).
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + dev pins
        # The full freeze (requirements-lock.txt) carries the GPU training
        # stack: PyPI torch==2.9.1 pulls the ~3 GB CUDA-12 wheel set and
        # exhausts the runner disk. Training itself is GPU-local (owner
        # decision 2026-10-05), so CI installs the CPU torch build instead —
        # same version pin, small enough for the suite that imports it.
        run: |
          python -m pip install -r requirements.txt
          python -m pip install torch==2.9.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.18.0

      - name: Assemble split model artifacts
        run: python scripts/assemble_models.py

      - name: Install package (editable)
        run: pip install -e .

      - name: Verify committed dataset manifest
        run: python scripts/check_dataset_manifest.py

      - name: Run tests
        run: python -m pytest

      - name: Lint (ruff)
        run: python -m ruff check src tests scripts
