[build-system]
# setuptools>=77: PEP 639 SPDX `license` expression below; build isolation
# installs the newest setuptools anyway, the floor just names the syntax bound.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mivia-small-json"
version = "1.0.0"
description = "Small CPU models that structure coding-workflow signals into strictly valid JSON: an 11-class schema router, a tool-match guard with honest abstention, learned field extractors, and zero-shot select/grade/verify primitives."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "MiviaLabs" }]
urls = { Homepage = "https://mivia.app", Repository = "https://github.com/MiviaLabs/mivia-small-json", Issues = "https://github.com/MiviaLabs/mivia-small-json/issues" }
classifiers = [
    # No License:: classifier here: with the PEP 639 `license` expression
    # above, setuptools >= 77 rejects the combination outright.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: General",
]
requires-python = ">=3.12"
# pyproject is the single source of truth for pins (AGENTS.md rule 5).
# requirements.txt mirrors it for the `pip install -r` / lock workflow;
# drift between the two is caught by tests/test_smoke.py.
dependencies = [
    "scikit-learn==1.9.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "skops==0.16.0",
    "onnxruntime==1.30.0",
    "tokenizers==0.23.2",
]

[project.optional-dependencies]
# Dev-only tools (CI/lint/mutation scan); never runtime dependencies.
dev = ["pytest==9.1.1", "ruff==0.16.10", "mutmut==3.8.0"]
# Serving surface (api.py): the REST quartet + the official MCP SDK over
# streamable HTTP. The stdlib sidecar (serve.py / mcp.py) needs none of
# these; this extra is for the networked deployment (see Dockerfile).
serve = [
    "fastapi==0.142.2", # ASGI app: /v1/* endpoints + MCP mount
    "uvicorn==0.54.0",  # ASGI server, single worker (models load once)
    "mcp==2.3.0",       # official MCP SDK; 2.x removed fastmcp aliases, pin exact
]
# GPU fine-tuning per owner decision 2026-10-05; runtime stays CPU-only and does not install torch.
# torch==2.9.1 is the PyPI pin; the GPU env installs 2.9.1+cu128 from the CUDA channel
# (https://download.pytorch.org/whl/cu128), not from PyPI.
training = ["torch==2.9.1", "transformers==5.18.0", "sentencepiece==0.2.0"]  # sentencepiece: XLM-R tokenizer conversion for multilingual bases

[tool.ruff]
# Dev-only lint. Conservative rule set (E, F, W) over the existing style;
# line-length 100 matches the code as written. CI runs `ruff check` after
# pytest — no format sweep, fixes stay reviewable.
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Authored corpus data (TRAINED_DOMAINS tuples of authored strings for the
# closed zero-shot-select r1 arm), not executable logic: wrapping 133
# authored data lines risks corrupting training material for zero value.
"scripts/zs_select_r1_domains.py" = ["E501"]

[tool.mutmut]
# Mutation scan is a standing measurement, not a gate: the CI job that
# runs it is continue-on-error and only records the score. Scope: the
# decision modules where the loop's high-severity findings lived.
paths_to_mutate = ["src/mivia_small_json/label.py",
                   "src/mivia_small_json/flywheel.py"]
tests_dir = ["tests"]
# The mutant sandbox needs the whole package importable (mutmut only
# writes the mutated modules into mutants/src, so the package dir needs
# __init__.py and the sibling modules from a plain copy, over which the
# mutated files are written), plus what tests read besides the package:
# a test imports scripts/backfill_pool.py; others read the committed
# corpora, the model artifact, CI config and the pin files.
also_copy = ["src/mivia_small_json", "scripts", "data", "models",
             "reports", "conftest.py", ".github", "requirements.txt",
             "requirements-lock.txt", "pyproject.toml", "README.md",
             "LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
